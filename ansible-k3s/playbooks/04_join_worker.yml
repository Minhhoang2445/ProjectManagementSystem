---
- name: Generate K3s join command
  hosts: master
  become: true
  vars_files:
    - ../vars/k3s.yml
    - ../vars/k3s_cluster.yml

  tasks:
    - name: Read K3s node token from master
      ansible.builtin.command:
        cmd: cat /var/lib/rancher/k3s/server/node-token
      register: k3s_token_raw
      changed_when: false

    - name: Store K3s token fact
      ansible.builtin.set_fact:
        k3s_node_token: "{{ k3s_token_raw.stdout | trim }}"


- name: Join worker nodes
  hosts: worker
  become: true
  vars_files:
    - ../vars/k3s.yml
    - ../vars/k3s_cluster.yml

  tasks:
    - name: Check if worker is already joined
      ansible.builtin.stat:
        path: /etc/systemd/system/k3s-agent.service
      register: k3s_agent_service

    - name: Join worker to K3s cluster
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/k3s-install.sh agent
          --node-ip={{ ansible_host }}
      environment:
        K3S_URL: "https://{{ control_plane_ip }}:{{ k3s_server_Port }}"
        K3S_TOKEN: "{{ hostvars[groups['master'][0]].k3s_node_token }}"
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      when: not k3s_agent_service.stat.exists
