{{- if and .Values.gateway.enabled .Values.gateway.httpRoute.enabled }}
apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute
metadata:
  name: {{ .Values.gateway.httpRoute.name }}
  namespace: {{ .Values.namespace }}
spec:
  parentRefs:
{{ toYaml .Values.gateway.httpRoute.parentRefs | nindent 4 }}
  rules:
{{ toYaml .Values.gateway.httpRoute.rules | nindent 4 }}
{{- end }}
