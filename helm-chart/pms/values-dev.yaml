# The chart defaults reproduce the current manifests. Add only reviewed
# development overrides here.
# Development environment overrides
# Development environment overrides

namespace: project-management-system

frontend:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent

backend:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  secret:
    create: true
    data:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      DATABASE_URL: "postgresql://postgres:123456@postgres-service:5432/PMS?schema=public"


database:
  replicaCount: 1
  image:
    pullPolicy: IfNotPresent
  persistence:
    enabled: true
    claimName: postgres-pvc
    size: 5Gi
  secret:
    create: true
    data:
      POSTGRES_USER: postgres
      POSTGRES_PASSWORD: "123456"
      POSTGRES_DB: PMS

gateway:
  enabled: true
  httpRoute:
    enabled: true
