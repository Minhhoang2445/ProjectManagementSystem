
{{- if .Values.backend.secret.create }}
apiVersion: v1
kind: Secret
metadata:
  name: {{ .Values.backend.existingSecret }}
  namespace: {{ .Values.namespace }}
type: Opaque
stringData:
  {{- range $key, $value := .Values.backend.secret.data }}
  {{ $key }}: {{ $value | quote }}
  {{- end }}
{{- end }}
