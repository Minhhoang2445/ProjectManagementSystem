name: Build Docker Image

on:
  push:
    branches:
      - main
  
jobs:
  docker:
    runs-on: ubuntu-latest

    steps:
      - name: Checkout code
        uses: actions/checkout@v4
      - name: login to DockerHub
        uses: docker/login-action@v3
        with: 
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}
      - name: Build Backend
        run: docker -t ${{ secrets.DOCKER_USERNAME }}/pms_backend:${{ github.sha }} ./backend
      - name: Build Frontend 
        run: docker -t ${{ secrets.DOCKER_USERNAME }}/pms_frontend:${{ github.sha }} ./frontend
      - name: Push Backend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/pms_backend:${{ github.sha }}
      - name: Push Frontend
        run: docker push ${{ secrets.DOCKER_USERNAME }}/pms_frontend:${{ github.sha }}
