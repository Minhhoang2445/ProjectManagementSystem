apiVersion: discovery.k8s.io/v1
kind: EndpointSlice

metadata:
  name: postgres-external
  namespace: project-management-system
  labels:
    kubernetes.io/service-name: postgres-service

addressType: IPv4

ports:
  - name: postgres
    protocol: TCP
    port: 5434

endpoints:
  - addresses:
    - "192.168.1.171"

