---
- name: Set up K3s control plane on master node
  hosts: master
  become: true

  vars_files:
    - ../vars/k3s.yml
    - ../vars/k3s_cluster.yml

  tasks:
    - name: Check if K3s cluster is already initialized
      ansible.builtin.stat:
        path: /etc/rancher/k3s/k3s.yaml
      register: k3s_conf

    - name: Initialize K3s server on master node
      ansible.builtin.command:
        cmd: >
          /usr/local/bin/k3s-install.sh server
          --node-ip={{ control_plane_ip }}
          --tls-san={{ control_plane_ip }}
          --cluster-cidr={{ pod_network_cidr }}
          --write-kubeconfig-mode=644
      environment:
        INSTALL_K3S_VERSION: "{{ k3s_version }}"
      when: not k3s_conf.stat.exists

    - name: Ensure K3s service is enabled and running
      ansible.builtin.systemd:
        name: k3s
        enabled: true
        state: started

    - name: Create .kube directory for user
      ansible.builtin.file:
        path: "/home/{{ ansible_user }}/.kube"
        state: directory
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0755"

    - name: Copy k3s.yaml to user .kube/config
      ansible.builtin.copy:
        src: /etc/rancher/k3s/k3s.yaml
        dest: "/home/{{ ansible_user }}/.kube/config"
        remote_src: true
        owner: "{{ ansible_user }}"
        group: "{{ ansible_user }}"
        mode: "0600"

