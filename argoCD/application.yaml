
apiVersion: argoproj.io/v1alpha1
kind: Application
metadata:
  name: project-management-system
  namespace: argocd

spec:
  project: default

  source:
    repoURL: https://github.com/Minhhoang2445/ProjectManagementSystem.git
    targetRevision: main
    path: helm-chart/pms
    helm:
      valueFiles:
        - values.yaml
        - values-dev.yaml

  destination:
    server: https://kubernetes.default.svc
    namespace: project-management-system

  syncPolicy:
    automated:
      prune: true
      selfHeal: true
    syncOptions:
      - CreateNamespace=true
