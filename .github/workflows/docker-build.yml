name: Build Docker Image

on:
  push:
    branches:
      - main
    paths:
      - 'backend/**'
      - 'frontend/**'
      - '.github/workflows/docker-build.yml'
  workflow_dispatch:

concurrency:
  group: pms-main-ci
  cancel-in-progress: false

jobs:
  docker:
    name: Build and Push Images
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    steps:
      - name: Checkout source code
        uses: actions/checkout@v4

      - name: Set up QEMU
        uses: docker/setup-qemu-action@v3

      - name: Set up Docker Buildx
        uses: docker/setup-buildx-action@v3

      - name: Login to Docker Hub
        uses: docker/login-action@v3
        with:
          username: ${{ secrets.DOCKER_USERNAME }}
          password: ${{ secrets.DOCKER_PASSWORD }}

      - name: Build and Push Backend
        uses: docker/build-push-action@v6
        with:
          context: ./backend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pms_backend:${{ github.sha }}

      - name: Build and Push Frontend
        uses: docker/build-push-action@v6
        with:
          context: ./frontend
          platforms: linux/amd64,linux/arm64
          push: true
          tags: ${{ secrets.DOCKER_USERNAME }}/pms_frontend:${{ github.sha }}

  update-image-tag:
    name: Update Helm Image Tags
    needs: docker
    if: github.ref == 'refs/heads/main'
    runs-on: ubuntu-latest

    permissions:
      contents: write

    steps:
      - name: Checkout main branch
        uses: actions/checkout@v4
        with:
          ref: main
          fetch-depth: 0

      - name: Set image tag
        run: echo "IMAGE_TAG=${GITHUB_SHA}" >> "$GITHUB_ENV"

      - name: Update tags in values.yaml
        uses: mikefarah/yq@v4.44.3
        with:
          cmd: |
            yq -i '.frontend.image.tag = strenv(IMAGE_TAG) | .backend.image.tag = strenv(IMAGE_TAG)' k8s/helm-chart/pms/values.yaml

      - name: Commit and push updated tags
        run: |
          git config user.name "github-actions[bot]"
          git config user.email "41898282+github-actions[bot]@users.noreply.github.com"

          if git diff --quiet; then
            echo "Image tags are already up to date."
            exit 0
          fi

          git add k8s/helm-chart/pms/values.yaml
          git commit -m "chore(helm): update image tags to ${IMAGE_TAG}"
          git push origin HEAD:main