apiVersion: apps/v1
kind: Deployment
metadata:
  name: backend-deployment
  namespace: project-management-system

spec:
  replicas: 1

  selector:
    matchLabels:
      app: backend

  template:
    metadata:
      labels:
        app: backend

    spec:
      containers:
        - name: backend-container
          image: binheo2445/pms_backend:latest
          imagePullPolicy: Never
          ports:
            - containerPort: 5000

          env:
            
            - name: DATABASE_URL
              valueFrom:
                secretKeyRef:
                  name: backend-secret
                  key: DATABASE_URL