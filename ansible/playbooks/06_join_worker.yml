---
- name: Generate Kubernetes join command
  hosts: k8s_master
  become: true
  vars_files:
    - ../vars/pass.yml
  tasks:

    - name: Generate join command
      ansible.builtin.command:
        cmd: kubeadm token create --print-join-command
      register: join_command
      changed_when: false

    - name: Store join command
      ansible.builtin.set_fact:
        kube_join_command: "{{ join_command.stdout }}"


- name: Join worker nodes
  hosts: k8s_worker
  become: true
  vars_files:
    - ../vars/pass.yml
  tasks:

    - name: Check if worker is already joined
      ansible.builtin.stat:
        path: /etc/kubernetes/kubelet.conf
      register: kubelet_config

    - name: Join worker to Kubernetes cluster
      ansible.builtin.command:
        cmd: "{{ hostvars[groups['k8s_master'][0]].kube_join_command }}"
      when: not kubelet_config.stat.exists