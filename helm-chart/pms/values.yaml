namespace: project-management-system

frontend:
  replicaCount: 1
  image:
    repository: binheo2445/pms_frontend
    tag: 419bc99023733744a58776141056a8bec2f499b9
    pullPolicy: Never
  containerPort: 8080
  service:
    name: frontend-service
    port: 8080
    targetPort: 8080
    type: ClusterIP
  env:
    VITE_API_URL: /api
  resources: {}

backend:
  replicaCount: 1
  image:
    repository: binheo2445/pms_backend
    tag: 419bc99023733744a58776141056a8bec2f499b9
    pullPolicy: Never
  containerPort: 5000
  service:
    name: backend-service
    port: 5000
    targetPort: 5000
    type: ClusterIP
  existingSecret: backend-secret
  secretKeys:
    databaseUrl: DATABASE_URL
  resources: {}

database:
  replicaCount: 1
  image:
    repository: postgres
    tag: "15"
    pullPolicy: IfNotPresent
  containerPort: 5432
  service:
    name: postgres-service
    port: 5432
    targetPort: 5432
    type: ClusterIP
  existingSecret: postgres-secret
  secretKeys:
    user: POSTGRES_USER
    password: POSTGRES_PASSWORD
    database: POSTGRES_DB
  persistence:
    enabled: true
    claimName: postgres-pvc
    accessModes:
      - ReadWriteOnce
    size: 5Gi
    storageClassName: ""
    mountPath: /var/lib/postgresql/data
  resources:
    requests:
      cpu: 100m
      memory: 256Mi
    limits:
      cpu: "1"
      memory: 1Gi

config:
  data:
    POSTGRES_DB: PMS
    POSTGRES_PORT: "5432"
    POSTGRES_HOST: postgres-service

gateway:
  enabled: true
  name: backend-gateway
  className: traefik-gateway-class
  listener:
    name: http
    protocol: HTTP
    port: 8000
    allowedRoutes:
      namespaces:
        from: All
  httpRoute:
    enabled: true
    name: backend-http-route
    parentRefs:
      - name: backend-gateway
    rules:
      - matches:
          - path:
              type: PathPrefix
              value: /api
        backendRefs:
          - name: backend-service
            port: 5000
      - matches:
          - path:
              type: PathPrefix
              value: /
        backendRefs:
          - name: frontend-service
            port: 8080
