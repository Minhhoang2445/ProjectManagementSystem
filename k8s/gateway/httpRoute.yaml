apiVersion: gateway.networking.k8s.io/v1
kind: HTTPRoute

metadata:
  name: backend-http-route
  namespace: project-management-system

spec:
  parentRefs:
    - name: backend-gateway

  rules:
    - matches:
        - path:
            type: PathPrefix
            value: /api

      backendRefs:
        - name: backend-service
          port: 5000

    - matches:
        - path:
            type: PathPrefix
            value: /

      backendRefs:
        - name: frontend-service
          port: 8080