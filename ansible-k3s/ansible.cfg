[defaults]
inventory = ./inventory/hosts.ini
playbook_dir = ./playbooks
host_key_checking = False
retry_files_enabled = False
interpreter_python = auto_silent
timeout = 30

[inventory]
enable_plugins = ini

[privilege_escalation]
become_method = sudo
become_user = root
become_timeout = 30

[ssh_connection]
pipelining = True
ssh_args = -o ControlMaster=auto -o ControlPersist=60s
